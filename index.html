<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <title>练练 · 跟练助手</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部标题栏 -->
    <header class="topbar">
      <div class="brand">练练 <span class="brand-sub">跟练助手</span></div>
      <button id="soundToggle" class="icon-btn" title="语音口令开关" aria-label="语音口令开关">🔊</button>
    </header>

    <!-- 内容区 -->
    <main id="view" class="view"></main>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <button class="tab" data-tab="library"><span class="tab-ico">📚</span><span>动作库</span></button>
      <button class="tab" data-tab="plan"><span class="tab-ico">📋</span><span>计划</span><span id="planBadge" class="badge" hidden>0</span></button>
      <button class="tab" data-tab="player"><span class="tab-ico">▶️</span><span>跟练</span></button>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="鸟狗式：四点支撑，伸出对侧手脚，保持背部与骨盆稳定">
  <rect width="480" height="240" rx="20" fill="#17232d"/>
  <path d="M30 205H450" stroke="#71838e" stroke-width="3"/>
  <!-- 支撑：双手双膝着地 -->
  <g fill="none" stroke="#4f6b75" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 125V198M280 130V198"/>
  </g>
  <!-- 伸展：对侧手脚（右手前伸、左腿后伸） -->
  <g fill="none" stroke="#77d9bc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 125L72 104"/>
    <path d="M280 130L398 106"/>
    <!-- 躯干：肩到髋保持平直 -->
    <path d="M180 125L280 130"/>
    <!-- 颈与头 -->
    <path d="M180 125L162 110"/>
  </g>
  <circle cx="150" cy="100" r="16" fill="none" stroke="#77d9bc" stroke-width="13"/>
  <text x="240" y="228" fill="#fff" text-anchor="middle" font-family="sans-serif" font-size="16">对侧手脚伸展 · 左右交替 · 腰背保持平直</text>
</svg>
